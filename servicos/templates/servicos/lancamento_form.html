{% extends 'servicos/base.html' %}
{% block conteudo %}

<form method="post" class="cartao" novalidate>

    <a class="botao secundario" href="{% url 'servicos:detalhe' servico.pk %}">Cancelar</a>

</form>
{% endblock %}
